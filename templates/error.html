<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Error {{ error_code }} — TrendAnalyzer">
  <title>{{ error_code }} {{ error_title }} — TrendAnalyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .error-page {
      min-height: 100vh;
      background: var(--canvas);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      padding: var(--space-6);
      position: relative;
    }
    .error-card {
      background: var(--surface-1);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: var(--card-shadow);
      position: relative;
      z-index: 1;
    }
    .error-code {
      font-family: var(--font-mono);
      font-size: 4.5rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: var(--space-3);
      background: linear-gradient(135deg, var(--accent) 0%, var(--text-primary) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: var(--space-3);
      color: var(--text-primary);
    }
    .error-message {
      font-size: 0.9375rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: var(--space-6);
    }
    .error-actions {
      display: flex;
      gap: var(--space-3);
      justify-content: center;
      flex-wrap: wrap;
    }
    .error-footer {
      position: absolute;
      bottom: var(--space-4);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      width: 100%;
      z-index: 1;
    }
    .error-footer a {
      color: var(--text-secondary);
      text-decoration: none;
      margin: 0 var(--space-2);
    }
    .error-footer a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body class="error-page">
  <canvas id="bgCanvas" style="position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;" aria-hidden="true"></canvas>

  <main class="error-card" role="main">
    <div class="error-code" aria-hidden="true">{{ error_code }}</div>
    <h1 class="error-title">{{ error_title }}</h1>
    <p class="error-message">{{ error_message }}</p>

    <div class="error-actions">
      <a href="/dashboard" class="btn-primary" style="text-decoration:none;padding:10px 20px;font-size:0.875rem;">
        Go to Dashboard
      </a>
      <a href="/login" class="btn-secondary" style="text-decoration:none;padding:10px 20px;font-size:0.875rem;">
        Sign In
      </a>
    </div>
  </main>

  <footer class="error-footer">
    <a href="/privacy">Privacy Policy</a> •
    <a href="/terms">Terms of Service</a> •
    <a href="/disclaimer">Financial Disclaimer</a> •
    <a href="/contact">Support</a>
  </footer>

  <script type="module">
    import { initStarGrid } from '/static/stargrid.js';
    const canvas = document.getElementById('bgCanvas');
    initStarGrid(canvas, { dotColor: 'rgba(56,189,248,0.10)', lineColor: 'rgba(56,189,248,0.22)', bgColor: '#050b14', dotSpacing: 48, numLines: 5, speed: 0.35 });
  </script>
</body>
</html>
