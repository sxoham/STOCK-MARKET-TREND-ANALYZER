<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your TrendAnalyzer account — AI-powered market trend analysis">
  <title>Register — TrendAnalyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>

<body class="auth-page" id="bgContainer">
  <canvas id="bgCanvas" style="position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;" aria-hidden="true"></canvas>

  <main class="auth-card" role="main">
    <!-- Logo -->
    <header class="auth-header">
      <div class="auth-logo" aria-label="TrendAnalyzer">
        <div class="auth-logo-mark" aria-hidden="true">
          <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="4" width="2" height="8" rx="0.5"/>
            <rect x="1" y="6" width="4" height="1" rx="0.5"/>
            <rect x="1" y="10" width="4" height="1" rx="0.5"/>
            <rect x="7" y="2" width="2" height="9" rx="0.5"/>
            <rect x="6" y="4" width="4" height="1" rx="0.5"/>
            <rect x="6" y="8" width="4" height="1" rx="0.5"/>
            <rect x="12" y="5" width="2" height="6" rx="0.5"/>
            <rect x="11" y="7" width="4" height="1" rx="0.5"/>
            <rect x="11" y="10" width="4" height="1" rx="0.5"/>
          </svg>
        </div>
        <span class="auth-logo-name">TrendAnalyzer</span>
      </div>
      <div>
        <h1 class="auth-title">Create account</h1>
        <p class="auth-subtitle">Start analyzing markets with AI</p>
      </div>
    </header>

    <!-- Register Form -->
    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          id="name"
          type="text"
          name="name"
          class="form-control"
          required
          autofocus
          placeholder="Your name"
          autocomplete="name"
          aria-required="true"
        >
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          name="email"
          class="form-control"
          required
          placeholder="name@example.com"
          autocomplete="email"
          spellcheck="false"
          inputmode="email"
          aria-required="true"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          class="form-control"
          required
          placeholder="At least 6 characters"
          autocomplete="new-password"
          aria-required="true"
          aria-describedby="passwordHint"
        >
        <span id="passwordHint" style="font-size: 0.7rem; color: var(--text-muted);">Minimum 6 characters</span>
      </div>

      <button type="submit" class="btn-primary btn-block" style="margin-top: var(--space-2);">
        Create Account
      </button>
    </form>

    <!-- Divider -->
    <div class="auth-divider">or</div>

    <!-- Google -->
    <button type="button" class="btn-google" id="googleBtn" aria-label="Sign up with Google">
      <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
      </svg>
      Continue with Google
    </button>

    <p class="auth-footer">
      Already have an account? <a href="/login">Sign in</a>
    </p>
  </main>

  <!-- Message Modal -->
  <div id="messageModal" class="modal" role="alertdialog" aria-modal="true" aria-labelledby="msgModalTitle">
    <div class="modal-content" style="max-width: 360px;">
      <h3 id="msgModalTitle">Message</h3>
      <div class="modal-body">
        <p id="msgModalContent" style="text-align: center; color: var(--text-primary);" aria-live="assertive"></p>
      </div>
      <div class="modal-actions" style="justify-content: center;">
        <button class="btn-primary" onclick="window.closeMessageModal()">OK</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, createUserWithEmailAndPassword, signInWithGoogle } from "/static/firebase-auth.js";
    import { initStarGrid } from '/static/stargrid.js';

    let redirectUrl = null;

    function showMessageModal(title, message, redirect = null) {
      document.getElementById('msgModalTitle').textContent = title;
      document.getElementById('msgModalContent').textContent = message;
      redirectUrl = redirect;
      document.getElementById('messageModal').classList.add('active');
    }

    window.closeMessageModal = function () {
      document.getElementById('messageModal').classList.remove('active');
      if (redirectUrl) {
        window.location.href = redirectUrl;
      }
    };

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = e.submitter || document.querySelector('.btn-primary[type="submit"]');
      const originalText = btn.textContent;

      try {
        btn.textContent = 'Creating account…';
        btn.disabled = true;
        await createUserWithEmailAndPassword(auth, email, password);
        showMessageModal("Account Created", "Your account has been created. Please sign in.", "/login");
      } catch (error) {
        let msg = "Registration failed. Please try again.";
        if (error.code === 'auth/email-already-in-use') {
          msg = "This email is already registered. Please sign in instead.";
        } else if (error.code === 'auth/weak-password') {
          msg = "Password must be at least 6 characters.";
        } else if (error.message) {
          msg = error.message;
        }
        showMessageModal("Registration Failed", msg);
        btn.textContent = originalText;
        btn.disabled = false;
      }
    });

    document.getElementById('googleBtn').addEventListener('click', async () => {
      const btn = document.getElementById('googleBtn');
      const originalHtml = btn.innerHTML;
      try {
        btn.innerHTML = 'Signing in…';
        btn.disabled = true;
        await signInWithGoogle();
        showMessageModal("Success", "Account created. Redirecting to dashboard…", "/dashboard");
      } catch (error) {
        showMessageModal("Sign Up Failed", error.message || "Could not sign up with Google.");
        btn.innerHTML = originalHtml;
        btn.disabled = false;
      }
    });

    const canvas = document.getElementById('bgCanvas');
    initStarGrid(canvas, { dotColor: 'rgba(56,189,248,0.10)', lineColor: 'rgba(56,189,248,0.22)', bgColor: '#050b14', dotSpacing: 48, numLines: 6, speed: 0.4 });
  </script>
</body>

</html>
